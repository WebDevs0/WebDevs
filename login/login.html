<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ResolveIT | Sign In</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700&display=swap">
    <link rel="stylesheet" href="login.css">
</head>
<body>

    <a href="login.html" class="logo">ResolveIT</a>

    <main class="auth">
        <h1>Sign in</h1>
        <p class="auth-intro">Use your my.unt.edu email.</p>

        <div class="auth-card">
            <form id="login-form" novalidate>

                <div class="field">
                    <label for="email">UNT email</label>
                    <input type="email" id="email" placeholder="euid@my.unt.edu" autocomplete="username">
                    <p class="error" id="email-error" hidden></p>
                </div>

                <div class="field">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Password" autocomplete="current-password">
                    <p class="error" id="password-error" hidden></p>
                </div>

                <!--Wrong email/password or server problems show here-->
                <p class="error form-error" id="form-error" role="alert" hidden></p>

                <button type="submit" class="btn btn-primary" id="submit-btn">Sign in</button>
            </form>

            <hr class="divider">

            <p class="switch">Don't have an account? <a href="register.html">Create one</a></p>
        </div>
    </main>

    <script src="login.js"></script>
</body>
</html>
